# Minimal sample configuration for the prototype.
#
# The prototype accepts either a normalized CK3 world snapshot directly,
# or the stdout of a preprocessing command via preprocessor_command.
#
# If you later wire in Rakaly or your own save flattener, set for example:
# preprocessor_command = python ../tools/normalize_ck3_json.py {input}
#
# Raw `.ck3` saves can now also be passed directly when
# auto_normalize_raw_ck3 = yes (the default).

ck3_input = sample_ck3_world.pds
# Optional live-install CK3 enrichment path:
# ck3_game_path = C:/Program Files (x86)/Steam/steamapps/common/Crusader Kings III
output_mod_path = generated/sample_mod
# Optional live-install validation path:
# eu5_game_path = C:/Program Files (x86)/Steam/steamapps/common/Europa Universalis V/game

location_framework = ../data/configurables/location_framework.csv
province_mappings = ../data/configurables/province_mappings.csv
title_mappings = ../data/configurables/title_mappings.csv
culture_mappings = ../data/configurables/culture_mappings.csv
religion_mappings = ../data/configurables/religion_mappings.csv
government_mappings = ../data/configurables/government_mappings.csv
country_colors = ../data/configurables/country_colors.csv

mod_name = CK3 to EU5 Sample Conversion
mod_id = ck3_to_eu5_sample
mod_version = 0.1.0
supported_game_version = 1.1.10

verbose_logging = yes
write_debug_snapshots = yes
# For crash isolation / validation builds:
# minimal_government_setup = yes
# validation_force_monarchy = yes
# validation_country_offset = 0
# validation_country_limit = 16
auto_normalize_raw_ck3 = yes
prefer_subject_realms = yes
minimum_subject_counties = 2
default_technology_level = 1
default_gold = 100
