l_english:
 CK3DISPLAYNAME: "Crusader Kings III to Europa Universalis V"
 CK3GAME: "Crusader Kings III"
 EU5GAME: "Europa Universalis V"
 CK3FOLDER: "Crusader Kings III Install Directory"
 CK3FOLDERTIP: "Where the game itself is installed, usually Steam/steamapps/common/Crusader Kings III. The converter reads the game's map and titles from here."
 CK3MOD: "Crusader Kings III Mod Directory"
 CK3MODTIP: "The path on your computer where Crusader Kings III stores mods"
 EU5FOLDER: "Europa Universalis V Install Directory"
 EU5FOLDERTIP: "Where the game itself is installed, usually Steam/steamapps/common/Europa Universalis V. The converter checks everything it writes against EU5's own countries, cultures and religions."
 CK3FILE: "Path to the converter executable"
 CK3FILETIP: "Path to CK3ToEU5Converter.exe"
 CK3SAVE: "CK3 Save to Convert"
 CK3SAVETIP: "The Crusader Kings III save you want to carry into EU5. EU5 starts on 1 April 1337, so a campaign played to around then converts most naturally, but any date works."
 CK3DOC: "Crusader Kings III Documents Directory"
 CK3DOCTIP: "The folder in your Documents where Crusader Kings III keeps saves and mods, usually Documents/Paradox Interactive/Crusader Kings III."
 EU5MOD: "Europa Universalis V Mod Directory"
 EU5MODTIP: "Where the finished mod is copied, usually Documents/Paradox Interactive/Europa Universalis V/mod. Afterwards, turn it on in EU5 from the Mods & DLCs panel on the main menu."
